<!DOCTYPE html>

<html>

<head>

```
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>
    Student Information System
</title>

<link rel="stylesheet"
      href="style.css">
```

</head>

<body>

<div class="login-card">

```
<!-- =====================================
     TITLE
====================================== -->

<h1>
    Student Information System
</h1>


<!-- =====================================
     USER ID
====================================== -->

<input
    type="text"
    id="userid"
    placeholder="User ID"
    autocomplete="username"
>


<!-- =====================================
     PASSWORD
====================================== -->

<input
    type="password"
    id="password"
    placeholder="Password"
    autocomplete="current-password"
>


<!-- =====================================
     LOGIN BUTTON
====================================== -->

<button
    type="button"
    onclick="login()"
>
    Login
</button>


<!-- =====================================
     LOGIN MESSAGE
====================================== -->

<p id="msg"></p>
```

</div>

<!-- =========================================
     LOGIN JAVASCRIPT
========================================= -->

<script src="login.js"></script>

</body>

</html>
